name: CI

# Runs the backend regression suite on every push + PR. The app is pure Python stdlib
# (no runtime deps); the only dev dependency is pytest (requirements-dev.txt).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax gate (compile every module)
        run: python -m py_compile app.py db.py

      - name: Run tests
        env:
          # deterministic env for the server-in-thread harness (never a real pepper)
          TK_ESIGN_PEPPER: ci-test-pepper-0123456789
        run: python -m pytest -q

  # The edge configuration has never been machine-checked, and it is the one file whose syntax
  # errors take portal.humiley.com off the internet: `docker compose up` recreates Caddy, and a
  # container that cannot parse its config does not start. `caddy reload` is safe (it validates
  # before applying, keeping the running config on error) but `update.sh` does not use reload.
  #
  # This validates the committed Caddyfile AND the staging template together, because the template
  # is copied into caddy.d/ by hand on the server, where nothing would catch a typo until the edge
  # was already being restarted.
  caddyfile:
    name: Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production edge config
        run: |
          docker run --rm -e PORTAL_DOMAIN=portal.humiley.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/caddy.d:/etc/caddy/conf.d:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Detail Schedule arithmetic
        run: node tests/detail_schedule_math.js

      # _VI is a plain object literal: a key defined twice keeps the LAST value and drops the first,
      # silently, at parse time. Thirty-three redundant definitions had accumulated; seven disagreed,
      # so one screen's wording was overwriting another's. The check that should have caught it was a
      # regex blind to 516 of the 3,764 pairs and had reported zero for months — this one scans the
      # literal properly and verifies itself against the JS engine before trusting its own answer.
      - name: Vietnamese dictionary has no duplicate keys
        run: node tests/vi_duplicate_keys.js

      # Nothing in CI has ever syntax-checked the JavaScript. `py_compile app.py db.py` covers the
      # Python; templates/index.html is 3 MB of inline <script> with no build step, and a bad splice
      # there fails silently — it kills one block, every function defined below the break stops
      # existing, and the symptom is a button whose handler is gone. That has already deleted six
      # functions from this file once. `node --check` per block, and it fails if it finds no blocks
      # to check rather than reporting a green tick for having examined nothing.
      - name: JavaScript in index.html parses
        run: python3 tools/check_index_js.py

      # #48 made static/sw.js the deployed build's identity, and asked in a comment that a branch
      # re-read main and bump if somebody got there first. A comment cannot enforce that: on the day
      # it landed, two further branches picked the same version anyway (v295, then v298), and the
      # symptom is invisible — production answers the same build string before and after a deploy,
      # so "Check for updates" has nothing to compare and a deploy check reports green on a deploy
      # that has not happened. Hence a check rather than a request.
      #
      # Only demanded when the PR actually changes what gets DEPLOYED. A docs-only or
      # workflow-only PR alters nothing a browser is served, and requiring a bump for those would
      # make the guard something people route around — including, on its first attempt, its own PR.
      - name: The service-worker version must be new when the deployed app changes
        if: github.event_name == 'pull_request'
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          deployed=$(printf '%s\n' "$changed" | grep -vE '^(docs/|tests/|tools/|\.github/|README|.*\.md$)' || true)
          if [ -z "$deployed" ]; then
            echo "No deployed file changed — a version bump is not required."
            printf 'changed:\n%s\n' "$changed"
            exit 0
          fi
          printf 'deployed files changed:\n%s\n' "$deployed"
          mine=$(grep -oE 'hml-pwa-v[0-9]+' static/sw.js | head -1)
          theirs=$(git show "$base:static/sw.js" | grep -oE 'hml-pwa-v[0-9]+' | head -1)
          echo "this branch: ${mine:-none}    ${{ github.base_ref }}: ${theirs:-none}"
          if [ -z "$mine" ] || [ -z "$theirs" ]; then
            echo "::error::Could not read hml-pwa-vNNN from static/sw.js on one side."
            exit 1
          fi
          m=${mine#hml-pwa-v}; t=${theirs#hml-pwa-v}
          if [ "$m" = "$t" ]; then
            echo "::error::static/sw.js is still $theirs, the same version ${{ github.base_ref }} is on."
            echo "::error::Bump it — otherwise /api/build cannot tell this build from the one before it."
            exit 1
          fi
          # Numeric, not lexical: v1000 must beat v999.
          if [ "$(printf '%s\n%s\n' "$m" "$t" | sort -n | tail -1)" != "$m" ]; then
            echo "::error::$mine is LOWER than ${{ github.base_ref }}'s $theirs. The version only goes up."
            exit 1
          fi
          echo "OK: $mine is newer than $theirs."

      - name: The staging service must not be called 'app'
        run: |
          # Compose registers the service name as a network alias. A staging service named 'app' on
          # humiley_net collides with production's, and Caddy's `reverse_proxy app:8000` would then
          # round-robin LIVE traffic into the staging copy — people reading, and writing, a stale
          # database. Cheap to assert, catastrophic to get wrong, easy to reintroduce.
          python3 - <<'PY'
          import sys, yaml
          svcs = list(yaml.safe_load(open('docker-compose.staging.yml'))['services'])
          prod = set(yaml.safe_load(open('docker-compose.yml'))['services'])
          clash = prod.intersection(svcs)
          if clash:
              sys.exit("staging service name(s) %s collide with production on the shared network" % sorted(clash))
          print("staging services:", svcs, "— no collision with", sorted(prod))
          PY

      - name: Validate it again with the staging site enabled
        run: |
          # A placeholder hash of a value nobody knows: this proves the block PARSES with a
          # well-formed bcrypt string. The real hash is generated on the server and never committed.
          sed -e 's/PASTE_THE_BCRYPT_HASH_HERE/$2a$14$ODWSbBEIKDVJefHfeMcCQeUKMHtGGoTuLpNSGGrHhOAWm4pLCPu2G/' \
              caddy.d/staging.caddy.example > caddy.d/staging.caddy
          docker run --rm -e PORTAL_DOMAIN=portal.humiley.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/caddy.d:/etc/caddy/conf.d:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      - name: A malformed caddy.d file must be REJECTED, not accepted
        run: |
          # The guard in update.sh is only worth anything if validation actually fails on bad input.
          # A check that passes on everything is not a check — this is the negative case that proves
          # the gate can say no.
          printf 'staging.example.com {\n  basic_auth {\n    staging not-a-bcrypt-hash\n  }\n}\n' > caddy.d/broken.caddy
          if docker run --rm -e PORTAL_DOMAIN=portal.humiley.com \
               -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
               -v "$PWD/caddy.d:/etc/caddy/conf.d:ro" \
               caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile; then
            echo "::error::caddy validate ACCEPTED a malformed password hash — the update.sh gate cannot protect the edge"
            exit 1
          fi
          echo "rejected as expected"
          rm -f caddy.d/broken.caddy
