name: CI

# Runs the backend regression suite on every push + PR. The app is pure Python stdlib
# (no runtime deps); the only dev dependency is pytest (requirements-dev.txt).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Backend tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # requirements.txt was never installed here, so nothing checked that it COULD be. A dependabot
      # bump to pywebpush>=2.4.0 merged green while being uninstallable on this job's Python: 2.2+
      # needs >= 3.10, and pip failing the file takes pypdf and cryptography down with it — push,
      # e-invoice extraction and e-signature verification, from one line about push. The tests passed
      # throughout because they never touched these libraries.
      #
      # --dry-run resolves the file without spending time on wheels the tests do not use. Resolution
      # is the thing that was broken, and the thing a version bump breaks.
      - name: Runtime dependencies must resolve on this Python
        run: pip install --dry-run -r requirements.txt

      - name: Syntax gate (compile every module)
        run: python -m py_compile app.py db.py

      - name: Run tests
        env:
          # deterministic env for the server-in-thread harness (never a real pepper)
          TK_ESIGN_PEPPER: ci-test-pepper-0123456789
        run: python -m pytest -q

  # The edge configuration has never been machine-checked, and it is the one file whose syntax
  # errors take portal.humiley.com off the internet: `docker compose up` recreates Caddy, and a
  # container that cannot parse its config does not start. `caddy reload` is safe (it validates
  # before applying, keeping the running config on error) but `update.sh` does not use reload.
  #
  # This validates the committed Caddyfile AND the staging template together, because the template
  # is copied into caddy.d/ by hand on the server, where nothing would catch a typo until the edge
  # was already being restarted.
  caddyfile:
    name: Caddyfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the production edge config
        run: |
          docker run --rm -e PORTAL_DOMAIN=portal.humiley.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/caddy.d:/etc/caddy/conf.d:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile

      - name: Detail Schedule arithmetic
        run: node tests/detail_schedule_math.js

      # A duplicate key in _VI is last-wins with NO parse error, and its diff shows only additions —
      # so it silently replaces a reviewed translation with whichever copy landed later, and the
      # damage is to a string nobody in the PR touched. It has happened twice: 159 duplicates
      # existed once, and a three-way merge reintroduced three more by appending both sides'
      # blocks, which is exactly the case no pre-merge check can see. Cheap to assert, invisible
      # otherwise.
      - name: No duplicate translation keys
        run: node tools/i18n/check.js dups

      # The In/Out Log carries one row per punch across many days. Until the Date column existed
      # every row showed only a clock time, so nobody could tell which day a check-in belonged to —
      # and the date filters looked broken because nothing on screen changed when you set one.
      # Two silent ways to get it wrong: `new Date("2026-08-21")` reads a BARE date as UTC midnight
      # and names the previous weekday west of Greenwich, and out-of-range parts do not throw but
      # ROLL OVER, so 2026-13-45 renders as a confident, wrong day. Both are asserted, along with
      # the column count agreeing across the header, the row and both full-width rows.
      - name: In/Out Log Date column
        run: node tests/inout_day_column.js

      # The board RECEIVES a `stalled` block; this asserts it SHOWS it. A JSON field nobody renders
      # makes nothing easier to monitor, which was the whole point of adding it — and a render that
      # throws leaves an empty panel nobody reports, as the Stages & Gates tab did for weeks.
      - name: The production board shows what has stopped
        run: node tests/ahu_board_shows_stalled.js

      # Same gap, the other screen: /api/ahu/kpi returns a `trend` series and the figure alone
      # cannot say which way anything is going, which is the only reason a target exists.
      - name: The KPI panel shows the trend
        run: node tests/ahu_kpi_shows_trend.js

      # A staff account opening ANY project met "Could not load this tab — check your connection",
      # on the Overview it lands on by default and on Schedule, because both listed the
      # manager-only pm_costs in `need` and pmTab treated a 403 as a fetch failure. Retrying a
      # permission decision never succeeds, so Retry was a loop with no exit. Also pins the WBS
      # picker's order: plain string sort puts "1.10" before "1.2", which is how a site engineer
      # loses 1.4.4.1 in a list of twenty codes.
      - name: Project tab access + WBS picker order
        run: node tests/pm_access_and_wbs.js

      # A four-person team rendered as four columns all reading "NGUYEN": the header took
      # `name.split(' ')[0]`, which in Vietnamese name order is the FAMILY name — carried by roughly
      # two in five people in the country. A RACI matrix exists to say who is Responsible, and four
      # identical columns cannot say it. The register holds BOTH name orders (see _pmSamePerson), so
      # "take the last token" breaks the other half instead. Also pins the deliverable order, which
      # was rendering 6, E, 2, F, 1, 5, A, C.
      - name: RACI matrix names the person, in order
        run: node tests/raci_names_and_order.js

      # The Reports period control was decorative: <select id="rpt-period"> had three hardcoded
      # months, no onchange, and no reader anywhere in 40,000 lines. Every tab reported ALL-TIME
      # figures under a control naming a month, and the Leave card's title was the literal string
      # "Leave Requests — May 2026" over rows dated July. That is worse than no control — it states
      # a scope the numbers do not have, and somebody reports those numbers to a client.
      - name: Reports period filter is real
        run: node tests/reports_period_filter.js

      # The WBS chain: sub-items -> master activity -> project. _pdTaskPct read _pdRows(), which is
      # narrowed to the detail schedule currently selected in the chip bar, so an activity fed by
      # two schedules reported only the half on screen and its percentage CHANGED when you clicked
      # the other chip. Also characterizes what the project percentage is computed from, because
      # that figure multiplies into EV, and EV into CPI/SPI/EAC on client-facing reports.
      - name: WBS roll-up chain
        run: node tests/wbs_rollup_chain.js

      # CPI and SPI hold a NUMBER even when the project has recorded nothing to measure — 1.00 from
      # a fallback, 0.00 from a zero numerator — and each reads as a finding: "exactly on budget",
      # "perfectly on schedule". This asserts the WIRING, not the maths: spiMeasurable existed for
      # an hour with three occurrences, all inside _pmEvm, read by no screen, so the Cost/EVM tab
      # kept printing SPI 1.00. A correct flag nobody consults changes nothing a user sees.
      - name: No screen prints an EVM index it did not measure
        run: node tests/evm_index_honesty.js

      # A payslip has one month on it. It used to have two: the unpaid-leave deduction divided by a
      # hardcoded Mon-Fri 22 while overtime, sixteen lines below, divided by the employee's real
      # schedule — so a Mon-Sat employee's absent day was priced at 1/22 of their month and their
      # overtime hour off 1/26 of it, on the document a Director e-signs. payroll_calc.py, the
      # characterization-locked Python port of the same function, had always used one figure.
      - name: One payslip, one month
        run: node tests/payslip_one_month.js

      # CPM seeded every early start at project day 0, so an activity connected to nothing still got
      # a Float figure and could wear the red CP badge; an undated detail line scored variance 0 and
      # flagged green "On plan" forever; every timeline bar was drawn one day short, which made a
      # milestone 0% wide and invisible; and the completion date read a reading's frozen raw pct
      # while everything else resolves it through _pdReadPct.
      - name: A schedule that says what it knows
        run: node tests/schedule_says_what_it_knows.js

      # "GPS Anomalies" counted a literal only the seed data writes, so it read 0 forever on live
      # data; "Total Hours Worked" dropped every overnight shift to zero while the In/Out tab
      # counted the same rows correctly; the late-arrivals chart drew bars for departments this
      # company does not have; the Payroll tab priced missing salaries at the grade mid-point and
      # called the result "Net paid". And the Check In screen — the one line a Vietnamese fitter
      # reads before every punch — was hardcoded English claiming to refuse a punch it allows.
      - name: Reports read the data, and Check In tells the truth
        run: node tests/reports_and_checkin_honesty.js

      # _VI is a plain object literal: a key defined twice keeps the LAST value and drops the first,
      # silently, at parse time. Thirty-three redundant definitions had accumulated; seven disagreed,
      # so one screen's wording was overwriting another's. The check that should have caught it was a
      # regex blind to 516 of the 3,764 pairs and had reported zero for months — this one scans the
      # literal properly and verifies itself against the JS engine before trusting its own answer.
      - name: Vietnamese dictionary has no duplicate keys
        run: node tests/vi_duplicate_keys.js

      # The drawing register's own self-check, run against the shipped code rather than a copy.
      - name: Drawing register check
        run: node tests/eng_register_check.js

      # Earned value, and the unit trap it refuses rather than obliges.
      - name: Design earned value
        run: node tests/eng_earned_value.js

      # The refusal log is the pilot's whole output, and it is the screen most able to fail
      # silently: a render that throws leaves a blank panel that reads as "nothing was ever
      # refused" — the single most misleading thing this particular tab could say. Driven here
      # against stub helpers, including the counting rule that separates one person stuck on one
      # drawing from a rule firing across the office.
      - name: The refusal log renders and counts honestly
        run: node tests/eng_refusal_view.js

      # Twenty-one registers now sit under six process groups. A tab whose group key does not match
      # any group is filtered out of the navigation and becomes unreachable while still existing —
      # no error, just an absence, which reads as "there is nothing here". Every tab must land in a
      # real group and every group must hold at least one tab.
      - name: Every design register is reachable from the tab bar
        run: node tests/eng_tab_groups.js

      # The other two design gates check LOGIC and would pass on markup carrying an unclosed <div>
      # — which, in a card layout, swallows everything below it into the card. Nothing throws; the
      # page is just wrong from that point down, and no source-level test can see it. This runs a
      # tag stack over what both screens actually emit, and self-tests the stack first so a clean
      # result means something.
      - name: The design screens emit well-formed markup
        run: node tests/eng_markup.js

      # Nothing in CI has ever syntax-checked the JavaScript. `py_compile app.py db.py` covers the
      # Python; templates/index.html is 3 MB of inline <script> with no build step, and a bad splice
      # there fails silently — it kills one block, every function defined below the break stops
      # existing, and the symptom is a button whose handler is gone. That has already deleted six
      # functions from this file once. `node --check` per block, and it fails if it finds no blocks
      # to check rather than reporting a green tick for having examined nothing.
      - name: JavaScript in index.html parses
        run: python3 tools/check_index_js.py

      # The AeroSelect handoff example is the fixture the OTHER application asserts its exporter
      # against, so it has to be reproducible from JavaScript — and it was not. It carried 810.0,
      # which Python renders with the trailing .0 and JSON.stringify cannot emit at all, so the two
      # sides hashed the same document differently. Checked in the language it has to work in.
      - name: The AeroSelect handoff example is reproducible from JavaScript
        run: node tests/handoff_example_cross_language.js

      # A device that keeps showing yesterday's app is the most expensive kind of bug here: the fix
      # ships, production serves it, and the person reporting it still cannot see it. The check that
      # was supposed to catch that compared the SERVICE WORKER's cache name against the server's —
      # which never answers the question, because the worker updates on its own schedule. A current
      # worker in front of a page loaded three deploys ago agreed with the server on every value
      # available, so nothing ever healed. This runs the real predicate out of index.html against a
      # truth table; the pre-fix logic fails four of its rows.
      - name: The stale-shell check can tell a stale PAGE from a stale worker
        run: node tests/stale_shell_verdict.js

      # "Why did the price change" is answered twice — by tender.compare_revisions for the record,
      # and by _tndDiff for the screen. Both used to key their lines on id alone, which dropped a
      # duplicate row's money and dropped id-less lines entirely; fixing one and not the other would
      # have left a tender whose stored explanation and on-screen explanation disagree. This runs
      # both over the same fixtures and compares the answers, so neither can drift alone.
      - name: The revision diff on screen matches the one in the record
        run: node tests/tender_diff_cross_language.js

      # A render that throws leaves an EMPTY PANEL and nobody reports it — that is how the Stages &
      # Gates tab sat blank in production for weeks. The Ledger is the screen a month is closed from,
      # so it gets driven here against a stubbed summary: it must draw the accounts, say whether the
      # month balances, offer Close only to a Director, and offer no posting at all once closed.
      - name: The Ledger screen actually renders
        run: node tests/ledger_screen_renders.js

      # Grouping a 39-field form into collapsed sections is layout, but THREE places walk
      # spec.fields assuming every entry is a field: the renderer, the save loop (data[undefined]
      # into every record) and the required-field gate. None of them would throw. This runs
      # _qaGroup for real and reads the Estimate spec back out of the page, so a field lost in a
      # reshuffle — one that silently stops being saved — fails here instead of in production.
      - name: A sectioned form still collects every field
        run: node tests/qa_form_sections.js

      # The win/loss reason list exists twice — Python (which REFUSES an unknown reason) and the
      # page (which offers the dropdown). One option the page offers and the server does not know
      # turns every save from that dropdown into a 400 the estimator cannot act on, and neither
      # side's own tests would see it.
      - name: The reasons the form offers are the reasons the server accepts
        run: node tests/tender_reasons_cross_language.js

      # A dashboard reads a dozen server fields. One read under the wrong name is `undefined`,
      # every guard skips it, and the panel renders FINE with a fact quietly missing — `cash.peak`
      # did exactly that (the server calls it `peakFunding`). This drives the screen and asserts the
      # key names against the Python that produces them.
      - name: The tender Overview screen renders
        run: node tests/tender_overview_renders.js

      # #48 made static/sw.js the deployed build's identity, and asked in a comment that a branch
      # re-read main and bump if somebody got there first. A comment cannot enforce that: on the day
      # it landed, two further branches picked the same version anyway (v295, then v298), and the
      # symptom is invisible — production answers the same build string before and after a deploy,
      # so "Check for updates" has nothing to compare and a deploy check reports green on a deploy
      # that has not happened. Hence a check rather than a request.
      #
      # Only demanded when the PR actually changes what gets DEPLOYED. A docs-only or
      # workflow-only PR alters nothing a browser is served, and requiring a bump for those would
      # make the guard something people route around — including, on its first attempt, its own PR.
      # The changed-file list comes from the API rather than from `git diff base...HEAD`, because
      # actions/checkout makes a SHALLOW clone: the two histories share no commit locally, and the
      # three-dot diff dies with "no merge base". Asking GitHub what the PR changes needs no history
      # at all. Main's sw.js still comes from git, which a depth-1 fetch of that one ref satisfies.
      - name: The service-worker version must be new when the deployed app changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          base="origin/${{ github.base_ref }}"
          git fetch --quiet --depth=1 origin "${{ github.base_ref }}"
          changed=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          # mobile/ is the Capacitor native shell. `COPY . /app` does put it in the image, so it is
          # tempting to call it deployed — but nothing there is ever served to a browser (app.py
          # never references it) and mobile/ios, mobile/android and node_modules are generated, not
          # committed. This guard exists so a PWA client can tell one BUILD OF THE SERVED APP from
          # the next; bumping hml-pwa-vNNN for a mobile/package.json change busts every user's
          # service-worker cache for something none of them can observe. The alternative — bumping
          # the version anyway to get a green tick — is exactly the routing-around this guard was
          # written to stop, so exclude the path instead of teaching people to fake the version.
          deployed=$(printf '%s\n' "$changed" | grep -vE '^(docs/|tests/|tools/|mobile/|\.github/|README|.*\.md$)' || true)
          if [ -z "$changed" ]; then
            echo "::error::The API returned no changed files for this PR — refusing to pass on a"
            echo "::error::list nobody could read, since an empty list would silently exempt anything."
            exit 1
          fi
          if [ -z "$deployed" ]; then
            echo "No deployed file changed — a version bump is not required."
            printf 'changed:\n%s\n' "$changed"
            exit 0
          fi
          printf 'deployed files changed:\n%s\n' "$deployed"
          mine=$(grep -oE 'hml-pwa-v[0-9]+' static/sw.js | head -1)
          theirs=$(git show "$base:static/sw.js" | grep -oE 'hml-pwa-v[0-9]+' | head -1)
          echo "this branch: ${mine:-none}    ${{ github.base_ref }}: ${theirs:-none}"
          if [ -z "$mine" ] || [ -z "$theirs" ]; then
            echo "::error::Could not read hml-pwa-vNNN from static/sw.js on one side."
            exit 1
          fi
          m=${mine#hml-pwa-v}; t=${theirs#hml-pwa-v}

          # Say which number to use, rather than only that this one is wrong.
          #
          # The guard has always rejected a stale version without suggesting a fresh one, so every
          # author re-derives it by hand from whatever branches they happen to think of — and races
          # the peers doing the same thing. That has cost four collisions in a single day, and twice
          # reached production, where two builds answered /api/build with the same string and a
          # deploy check went green on a deploy that had not happened.
          #
          # The claims come from the API, not from git: actions/checkout makes a SHALLOW clone, so
          # `git branch -r` here sees almost nothing and a scan over it would confidently recommend
          # a number several peers already hold. Reading each open PR's head is a handful of calls
          # and sees what git cannot.
          #
          # A GAP, not +1. The scan is a snapshot of a moving thing: the number is free when it is
          # read and taken by the time CI runs. The gap costs nothing — the version is opaque and
          # only has to increase — and it buys the minutes between picking and merging.
          #
          # This is ADVICE. Every call is best-effort and the whole block is wrapped so that it can
          # never change whether the guard passes or fails: a failing suggestion must not turn a
          # correct version into a red tick, which would be a worse bug than the one being fixed.
          suggest() {
            hi=$1
            for br in $(gh api --paginate "repos/${{ github.repository }}/pulls?state=open" \
                          --jq '.[].head.ref' 2>/dev/null || true); do
              raw=$(gh api -H "Accept: application/vnd.github.raw" \
                      "repos/${{ github.repository }}/contents/static/sw.js?ref=$br" 2>/dev/null || true)
              v=$(printf '%s' "$raw" | grep -oE 'hml-pwa-v[0-9]+' | head -1 || true)
              [ -z "$v" ] && continue
              n=${v#hml-pwa-v}
              case "$n" in ''|*[!0-9]*) continue ;; esac
              [ "$n" -gt "$hi" ] && hi=$n
            done
            echo $((hi + 3))
          }

          if [ "$m" = "$t" ] || [ "$(printf '%s\n%s\n' "$m" "$t" | sort -n | tail -1)" != "$m" ]; then
            pick=$(suggest "$t" 2>/dev/null || echo $((t + 3)))
            if [ "$m" = "$t" ]; then
              echo "::error::static/sw.js is still $theirs, the same version ${{ github.base_ref }} is on."
              echo "::error::Otherwise /api/build cannot tell this build from the one before it."
            else
              # Numeric, not lexical: v1000 must beat v999.
              echo "::error::$mine is LOWER than ${{ github.base_ref }}'s $theirs. The version only goes up."
            fi
            echo "::error::Use hml-pwa-v$pick — the highest claimed on any open PR, plus a gap so a"
            echo "::error::peer merging while this runs does not take it from under you."
            echo "::error::  sed -i '' \"s/hml-pwa-v$m/hml-pwa-v$pick/\" static/sw.js"
            exit 1
          fi
          echo "OK: $mine is newer than $theirs."

      - name: The staging service must not be called 'app'
        run: |
          # Compose registers the service name as a network alias. A staging service named 'app' on
          # humiley_net collides with production's, and Caddy's `reverse_proxy app:8000` would then
          # round-robin LIVE traffic into the staging copy — people reading, and writing, a stale
          # database. Cheap to assert, catastrophic to get wrong, easy to reintroduce.
          python3 - <<'PY'
          import sys, yaml
          svcs = list(yaml.safe_load(open('docker-compose.staging.yml'))['services'])
          prod = set(yaml.safe_load(open('docker-compose.yml'))['services'])
          clash = prod.intersection(svcs)
          if clash:
              sys.exit("staging service name(s) %s collide with production on the shared network" % sorted(clash))
          print("staging services:", svcs, "— no collision with", sorted(prod))
          PY

      - name: Validate it again with the staging site enabled
        run: |
          # A placeholder hash of a value nobody knows: this proves the block PARSES with a
          # well-formed bcrypt string. The real hash is generated on the server and never committed.
          sed -e 's/PASTE_THE_BCRYPT_HASH_HERE/$2a$14$ODWSbBEIKDVJefHfeMcCQeUKMHtGGoTuLpNSGGrHhOAWm4pLCPu2G/' \
              caddy.d/staging.caddy.example > caddy.d/staging.caddy
          docker run --rm -e PORTAL_DOMAIN=portal.humiley.com \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/caddy.d:/etc/caddy/conf.d:ro" \
            caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile
      - name: A malformed caddy.d file must be REJECTED, not accepted
        run: |
          # The guard in update.sh is only worth anything if validation actually fails on bad input.
          # A check that passes on everything is not a check — this is the negative case that proves
          # the gate can say no.
          printf 'staging.example.com {\n  basic_auth {\n    staging not-a-bcrypt-hash\n  }\n}\n' > caddy.d/broken.caddy
          if docker run --rm -e PORTAL_DOMAIN=portal.humiley.com \
               -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
               -v "$PWD/caddy.d:/etc/caddy/conf.d:ro" \
               caddy:2 caddy validate --adapter caddyfile --config /etc/caddy/Caddyfile; then
            echo "::error::caddy validate ACCEPTED a malformed password hash — the update.sh gate cannot protect the edge"
            exit 1
          fi
          echo "rejected as expected"
          rm -f caddy.d/broken.caddy
