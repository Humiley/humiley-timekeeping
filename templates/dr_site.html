<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Daily Report</title>
<!--
  The site's own daily report form.

  A SEPARATE PAGE, not part of the portal shell. The portal's index.html is 4 MB and assumes a
  signed-in employee; the people using this are on a phone, on a plant-room connection, standing up,
  and are not employees at all. So this is one small self-contained file with no framework, no
  fonts to fetch and no build step — it has to open on a bad connection or it does not get used,
  and a report that does not get used is a report somebody emails as a photo of a notebook instead.

  It knows nothing about the portal. Every request goes to /api/dr/site/*, carries the token from
  the address bar, and gets back only this contractor's own configuration and its own day.

  SAVED A SECTION AT A TIME. One dropped connection then loses the section being worked on rather
  than the whole day, which is the difference between an annoyance and starting again.
-->
<style>
  /* Lifted from index.html's :root rather than approximated, so this page and the portal cannot
     drift apart on the brand. Same navy, same emerald, same radii and elevation scale. The values
     are copied because this page must stay one self-contained file — it is opened by people with
     no portal account, often on a bad connection, and a stylesheet request is a chance to fail. */
  :root{
    --navy:#205090; --navy-deep:#163866; --navy-light:#3168A8;
    --emerald:#00B060; --emerald-deep:#008548;
    --danger:#C00000; --warn:#F59E0B;
    --ink:#1F2937; --mut:#5C6470; --faint:#8A93A5;
    --bg:#f0f2f8; --card:#FFFFFF; --line:#dde2ee; --soft:#e8edf6;
    /* Radii and elevation from the AeroSano system (globals.css → HML-BG-002 Rev 07.0):
       card 1.25rem, panel 1.75rem, and elevation that is FLAT AND ENGINEERED — a hairline ring
       plus a barely-there lift, not the soft 34px drop this page had. On a phone in daylight the
       heavy shadow read as a smudge under every card; the ring reads as a drawn edge, which is what
       a document wants. */
    --r-sm:8px; --r-md:12px; --r-btn:999px; --r-lg:20px; --r-panel:28px; --r-pill:999px;
    --shadow-sm:0 1px 2px rgba(15,38,71,.04);
    --shadow-card:0 1px 2px rgba(15,38,71,.04),0 8px 24px rgba(15,38,71,.06);
    --ring:inset 0 0 0 1px var(--line);
    /* HML-BG-002 p.28: ease-out in, ease-in out, no bounce. */
    --ease:cubic-bezier(.16,.84,.44,1);
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font:16px/1.55 Calibri,'Segoe UI',system-ui,-apple-system,Arial,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
    -webkit-text-size-adjust:100%;
    text-rendering:optimizeLegibility;
    -webkit-font-smoothing:antialiased;
    font-synthesis-weight:none;   /* never let the browser fake a weight the face does not have */
  }
  h1,h2,h3{color:var(--navy);font-weight:700;letter-spacing:-.018em;text-wrap:balance}
  p{text-wrap:pretty}
  ::selection{background:var(--emerald);color:#fff}
  /* Emerald is the accent, and the focus ring is where an accent earns its keep — it has to be the
     one thing on the page that is unmistakably not part of the form. */
  :focus-visible{outline:2px solid var(--emerald);outline-offset:3px;border-radius:4px}
  .wrap{max-width:680px;margin:0 auto;padding:0 14px 40px}


  /* An INSET navy panel with rounded corners, which is what AeroSano's PageHero actually is —
     its own docstring calls it that. The full-bleed square-cornered strip this had was the one
     piece of the page that never matched: it welded the header to the window while every other
     surface floated on the light ground. The gradient is still the portal sidebar's, so the
     product is still recognisable. */
  header{padding:calc(10px + env(safe-area-inset-top)) 14px 0;background:transparent}
  header .wrap{position:relative;overflow:hidden;border-radius:var(--r-panel);
               background:linear-gradient(170deg,#0f2040 0%,#162f5a 30%,#1e4a90 70%,#1a5878 100%);
               color:#fff;display:flex;align-items:center;gap:12px;padding:18px 20px;
               box-shadow:var(--shadow-card)}
  /* The engineering grid, at the same weight and pitch the system uses. It is what stops a large
     navy field reading as a blank rectangle. */
  header .wrap::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(to right,rgba(255,255,255,.07) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:56px 56px}
  header .wrap > *{position:relative}
  /* `color:#fff` explicitly, not inherited. The base h1 rule sets headings navy — correct on every
     white card and catastrophic here, where it painted the title navy on the navy bar and left it
     just about readable. A colour that arrives by inheritance is a colour one later rule can take
     away without touching this one. */
  header h1{font-size:17px;margin:0;font-weight:700;flex:1;line-height:1.25;min-width:0;color:#fff}
  header .who{font-size:11.5px;opacity:.85;font-weight:400;display:block;
              overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* The three marks moved onto the document masthead below, where they belong: this bar is the
     product's chrome, that is the report. They sit on a WHITE plate there because a logo is drawn
     for paper and most arrive as dark artwork on transparent — on any coloured ground half of them
     vanish, which looks exactly like a logo nobody set. */
  /* Both languages visible, the current one lit. A single button showing the OTHER language is a
     coin-flip for anybody who has not used it before — it never says which state you are in.
     Flags are drawn inline as SVG, not emoji: 🇻🇳 does not render on Windows Chrome and degrades to
     the bare letters "VN", which is the exact platform most specifiers are on. The written code
     beside each flag carries the meaning; a flag is a country, not a language, so the SVGs are
     hidden from screen readers. */
  .lang{display:flex;gap:2px;flex:0 0 auto;background:rgba(255,255,255,.14);
        border-radius:var(--r-pill);padding:3px}
  .lang button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;
        color:rgba(255,255,255,.72);font-size:12px;font-weight:700;letter-spacing:.04em;
        padding:6px 10px;border-radius:var(--r-pill);cursor:pointer;box-shadow:none;min-height:0}
  .lang button[aria-pressed="true"]{background:#fff;color:var(--navy-deep)}
  .lang svg{width:20px;height:14px;flex:none;border-radius:2px;
            box-shadow:0 0 0 1px rgba(0,0,0,.12);display:block}

  .card{background:var(--card);border:0;border-radius:var(--r-lg);
        padding:18px;margin-top:12px;box-shadow:var(--ring),var(--shadow-card)}

  /* ── the masthead ───────────────────────────────────────────────────────────────────────────
     THREE marks, in the order the printed report uses them: the OWNER's on the left because it is
     their project and their document, HUMILEY's in the middle because we are the PMC issuing it,
     and the CONTRACTOR's on the right because they are the ones filing it. Somebody who signs this
     should be able to see at a glance whose report it is; the form used to say only "Daily Report"
     and the contractor's own name, which is the one party that never needed telling. */
  .doc{background:var(--card);border:0;border-radius:var(--r-panel);position:relative;
       margin-top:14px;overflow:hidden;box-shadow:var(--ring),var(--shadow-card)}
  /* The Humiley signature graphic: ONE emerald corner triangle per surface. It goes on the document
     panel and nowhere else — repeated on every card it stops being a signature and becomes a
     pattern. Sized so it sits under the date line rather than beside anything readable. */
  .doc .corner{position:absolute;right:0;bottom:0;width:52px;height:52px;background:var(--emerald);
               clip-path:polygon(100% 0,100% 100%,0 100%);pointer-events:none}
  .doc .marks{display:flex;align-items:center;gap:12px;padding:14px 18px;
              border-bottom:1px solid var(--line);background:#fff}
  .doc .mk{flex:0 0 auto;display:none;align-items:center;justify-content:center;
           height:38px;max-width:104px}
  .doc .mk.on{display:flex}
  .doc .mk img{max-height:34px;max-width:100px;width:auto;height:auto;display:block}
  /* The middle mark is also the spacer that pushes the contractor's to the right edge, so it must
     be free to grow — `max-width` on .mk would otherwise cap it and leave all three bunched to the
     left, which is what the tablet showed. The IMG inside stays capped; the BOX does not. */
  /* The middle slot is also the spacer that holds the outer two apart, so it grows whether or not
     it has a logo to show — `display:none` on it would collapse the header's whole geometry. */
  .doc .mk.mid{flex:1 1 auto;justify-content:center;max-width:none;display:flex}
  .doc .mk.mid:not(.on) img{display:none}
  .doc .mk.end{justify-content:flex-end}
  .doc .title{padding:15px 18px 4px;text-align:center}
  .doc .title h1{margin:0;font-size:17px;font-weight:700;color:var(--navy-deep);
                 letter-spacing:.02em;text-transform:uppercase}
  .doc .title .sub{font-size:12.5px;color:var(--mut);margin-top:3px}
  .doc dl{margin:0;padding:12px 18px 16px;display:grid;grid-template-columns:auto 1fr;
          gap:5px 14px;font-size:12.5px;align-items:baseline}
  .doc dt{color:var(--faint);font-weight:600;white-space:nowrap}
  .doc dd{margin:0;color:var(--ink);font-weight:600;overflow-wrap:anywhere}

  /* ── the date ───────────────────────────────────────────────────────────────────────────────
     It decides which day every one of the fourteen sections belongs to, so it is the single most
     consequential control on the page — and it was a bare date input in a row of form fields,
     indistinguishable from "Average temperature". It now reads as what it is, states the day in
     words so a mis-tapped month is visible rather than merely present, and offers the two days
     anybody actually files. */
  .dt{padding:14px 18px;border-top:1px solid var(--line);background:var(--soft)}
  /* The eyebrow is the system's own device: uppercase, tracked out, an emerald dot holding the
     line. It marks the one control on this page that decides which day everything else belongs to. */
  .dt .lab{display:inline-flex;align-items:flex-start;gap:8px;font-size:11px;letter-spacing:.16em;
           text-transform:uppercase;color:var(--emerald-deep);font-weight:700;margin-bottom:8px}
  .dt .lab::before{content:"";width:8px;height:8px;margin-top:.42em;border-radius:999px;
                   background:var(--emerald);flex:none}
  .dt .pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .dt input[type=date]{flex:1 1 190px;min-width:0;font-weight:600;background:#fff}
  .dt .quick{display:flex;gap:6px}
  .dt .quick button{padding:9px 13px;font-size:13px;border-radius:var(--r-pill);background:#fff}
  .dt .quick button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .dt .said{font-size:12.5px;color:var(--mut);margin-top:8px}
  .dt .said b{color:var(--navy-deep)}
  .filed{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:700;
         color:var(--emerald-deep);background:rgba(0,176,96,.12);border:1px solid rgba(0,176,96,.3);
         border-radius:var(--r-pill);padding:3px 10px}
  h2{font-size:15px;margin:0 0 10px;color:var(--navy-deep);font-weight:700;letter-spacing:-.012em}
  /* Section eyebrow: the same device as the date's, so an open section announces which part of the
     report it becomes before it asks for anything. */
  .eyebrow{display:inline-flex;align-items:flex-start;gap:8px;font-size:11px;letter-spacing:.16em;
           text-transform:uppercase;color:var(--emerald-deep);font-weight:700;margin:0 0 6px}
  .eyebrow::before{content:"";width:8px;height:8px;margin-top:.42em;border-radius:999px;
                   background:var(--emerald);flex:none}
  .card > h2:first-of-type{margin-top:0}
  p.hint{font-size:13px;color:var(--mut);margin:0 0 12px;line-height:1.5}

  label{display:block;font-size:12.5px;color:var(--mut);font-weight:600;margin:0 0 4px}
  input,select,textarea{
    width:100%;font:16px/1.4 inherit;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px;
  }
  /* 16px is not a style choice: anything smaller makes iOS Safari zoom the whole page on focus. */
  textarea{min-height:64px;resize:vertical}
  /* ONE focus language. `input:focus` (0,1,1) outranks the `:focus-visible` rule above (0,1,0), so
     fields were quietly keeping a navy ring while every button got the emerald one — two focus
     colours on one page, by accident rather than decision. The ring is emerald everywhere; the
     navy BORDER stays, because that is the field saying it is the active one. */
  input:focus,select:focus,textarea:focus{outline:2px solid var(--emerald);outline-offset:3px;
                                          border-color:var(--navy)}
  .row{margin-bottom:12px}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:repeat(3,1fr)}

  button{font:15px/1 inherit;font-weight:700;border-radius:var(--r-btn);border:1px solid var(--line);
         background:var(--card);color:var(--ink);padding:13px 18px;cursor:pointer;
         box-shadow:var(--shadow-sm);
         transition:background-color .18s var(--ease),color .18s var(--ease),
                    border-color .18s var(--ease),transform .18s var(--ease),
                    box-shadow .18s var(--ease)}
  button:active{transform:translateY(1px)}
  .primary{background:var(--navy);border-color:var(--navy);color:#fff}
  .wide{width:100%}
  .link{background:none;border:0;color:var(--navy);text-decoration:underline;padding:6px 2px;font-size:13.5px}
  button[disabled]{opacity:.55;cursor:default}

  .msg{font-size:13.5px;border-radius:var(--r-md);padding:11px 13px;margin-top:10px;line-height:1.5}
  .msg.err{background:#FDECEA;color:#8A2118;border:1px solid #F3C4BE}
  .msg.ok{background:#E9F7F0;color:#0A6B45;border:1px solid #BFE6D4}
  .msg.info{background:var(--soft);color:var(--mut);border:1px solid var(--line)}

  /* the section menu */
  .sections{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
  .sections li{border-top:1px solid var(--line)}
  .sections li:first-child{border-top:0}
  /* A part heading — 2 Manpower, 5 Work progress, 9 Inspection — for the three numbers the report
     splits into sub-sections. Without them the index read 1, 2.1, 2.2, 3, 4, 5.1, 5.3 as one flat
     run, and the gaps looked like mistakes rather than structure. */
  /* A MAIN item and a PART heading are the same level of the document and now look it: navy
     number, the title at full weight. Before, "1 Weather" was a bold clickable row and "2 Manpower"
     a small grey label, so two things at the same level of the report looked like two different
     kinds of thing — which is what made the list read as arbitrary.
     SUB items sit under a rule, indented from their parent's number. */
  .sections .parthead{display:flex;align-items:center;gap:12px;padding:14px 8px 8px}
  .sections .parthead .no{flex:0 0 2.7em;font-weight:700;color:var(--navy);font-size:13px;
                          font-variant-numeric:tabular-nums}
  .sections .parthead .nm{font-size:14.5px;font-weight:700;color:var(--ink)}
  .sections .subs{margin:0 0 6px 2.7em;padding-left:12px;border-left:2px solid var(--line)}
  .sections .subs button{padding-top:10px;padding-bottom:10px;font-weight:600}
  .sections button.sub .no{flex:0 0 2.4em;color:var(--emerald-deep);font-size:12.5px}
  .sections button{width:100%;text-align:left;display:flex;align-items:center;gap:12px;
    border:0;background:none;padding:14px 8px;font-weight:600;font-size:14.5px;
    border-radius:var(--r-sm);box-shadow:none}
  .sections button:hover{background:var(--soft)}
  .sections button:active{transform:none}
  .sections .n{flex:1}
  /* The section's number in the PRINTED report, in the accent colour. This is the two-tone heading
     the system asks for — one navy line, one emerald phrase — with the emerald carrying something
     true rather than a word picked for emphasis. It also turns the menu into an index: a person can
     see that 5.2 is missing and know why (the Gantt is drawn by the portal, not filed by the site). */
  .sections .no{flex:0 0 2.7em;font-weight:700;color:var(--emerald-deep);
                font-variant-numeric:tabular-nums;font-size:13px;letter-spacing:.01em}
  .count{font-size:12px;font-weight:600;color:var(--faint);font-variant-numeric:tabular-nums}
  .count.has{color:var(--emerald)}
  .chev{color:var(--faint);font-size:13px}

  /* repeating rows */
  .item{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:10px;
        background:var(--soft)}
  .item .top{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
  .item .top b{flex:1;font-size:13px;color:var(--navy-deep)}
  .del{background:none;border:0;color:var(--danger);font-size:12.5px;padding:2px 4px;text-decoration:underline}

  .photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
  .photos figure{margin:0;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;
                 background:var(--soft)}
  .photos img{width:100%;height:78px;object-fit:cover;display:block}
  .photos figcaption{font-size:10.5px;color:var(--mut);padding:4px 5px;text-align:center;
                     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* It was a full-bleed white strip with square corners welded to the bottom of the window —
     the last surface on the page that was not a rounded card on the light ground. Now it is one,
     and it still sticks, because on a fourteen-section form the Save button has to stay reachable
     without scrolling back. */
  .bar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom));
       background:var(--card);border-radius:var(--r-lg);
       padding:10px;margin:14px 0 0;display:flex;gap:10px;
       box-shadow:var(--ring),var(--shadow-card)}
  .bar button{flex:1}
  .foot{font-size:11.5px;color:var(--faint);text-align:center;margin-top:18px;line-height:1.6}
  /* A closing panel rather than a line of grey text. It says who issued the form, for which
     project, and what happens to what is typed into it — which is the question somebody filing a
     document for the first time actually has. */
  footer.doc-foot{margin:16px 0 0;border-radius:var(--r-panel);overflow:hidden;position:relative;
    background:linear-gradient(170deg,#0f2040 0%,#162f5a 30%,#1e4a90 70%,#1a5878 100%);
    color:rgba(255,255,255,.82);box-shadow:var(--shadow-card);padding:20px}
  footer.doc-foot::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.4;
    background-image:linear-gradient(to right,rgba(255,255,255,.07) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(255,255,255,.07) 1px,transparent 1px);
    background-size:56px 56px}
  footer.doc-foot > *{position:relative}
  footer.doc-foot img{height:22px;width:auto;display:block;margin-bottom:10px}
  footer.doc-foot .fline{font-size:12.5px;line-height:1.65}
  footer.doc-foot .fline b{color:#fff;font-weight:700}
  footer.doc-foot .fmeta{margin-top:12px;padding-top:12px;font-size:11.5px;
    border-top:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.6);
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
  footer.doc-foot .corner{position:absolute;right:0;bottom:0;width:52px;height:52px;
    background:var(--emerald);clip-path:polygon(100% 0,100% 100%,0 100%);pointer-events:none}
  footer.doc-foot .signout{background:transparent;border:1px solid rgba(255,255,255,.28);
    color:#fff;font-size:12px;font-weight:700;padding:8px 14px;border-radius:var(--r-pill);
    box-shadow:none;min-height:0}
  .hide{display:none !important}
  /* HML-BG-002 p.28. Motion is information: it says the page has finished arriving. One pass, no
     stagger — a fourteen-row list that animates in sequence is a list somebody waits for. */
  @keyframes reveal{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .reveal{animation:reveal .4s var(--ease) both}
  /* ── narrow phones ──────────────────────────────────────────────────────────────────────────
     Two number fields side by side stop being usable somewhere around a 360px screen — the label
     wraps to three lines and the input is too small to hit. Below that they stack. */
  @media (max-width:400px){
    .g2,.g3{grid-template-columns:1fr}
  }

  /* ── tablets: iPad portrait upwards ─────────────────────────────────────────────────────── */
  @media (min-width:700px){
    .wrap{max-width:840px;padding:0 20px 48px}
    .card{padding:22px 24px}
    header h1{font-size:19px}
    header .who{font-size:12.5px}
    .doc .mk{height:46px;max-width:150px}
    .doc .mk img{max-height:42px;max-width:146px}
    .doc .title h1{font-size:19px}
    .doc dl{grid-template-columns:auto 1fr auto 1fr;padding:14px 22px 18px}
    /* The menu is 14 entries. On a phone that is a scroll; given width it is two columns and the
       whole day is visible at once, which is the difference between hunting for the section you
       have not filled in and seeing it. */
    .sections{display:grid;grid-template-columns:1fr 1fr;column-gap:22px}
    .sections li{border-top:1px solid var(--line)}
    .sections li:nth-child(2){border-top:0}
  }

  /* ── desktop ────────────────────────────────────────────────────────────────────────────── */
  @media (min-width:1024px){
    .wrap{max-width:980px}
    .sections{grid-template-columns:repeat(3,1fr);column-gap:26px}
    .sections li:nth-child(3){border-top:0}
    /* A form field 900px wide is harder to read, not easier. The inputs keep a sane measure and
       the width goes to the layout instead. */
    .row input,.row select,.row textarea{max-width:520px}
    .g2 input,.g2 select,.g3 input,.g3 select{max-width:none}
    /* Sticky-to-the-bottom is a phone idiom. On a desktop the actions belong with the form. */
    .bar{position:static;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--line);
         box-shadow:none;justify-content:flex-start}
    .bar button{flex:0 0 auto;min-width:150px}
  }

  /* A pointer is not a finger. Touch targets stay at 44px where there is no hover to help. */
  @media (hover:none){
    .sections button{min-height:52px}
    button{min-height:46px}
  }

  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1 id="hTitle">Daily Report<span class="who" id="hWho"></span></h1>
  <span class="lang" role="group" aria-label="Language">

<script>
/* ── the two languages, inline ────────────────────────────────────────────────────────────────
   The people filling this in work on a site in Dong Nai. The dictionary is inline rather than
   fetched because a second request on a bad connection is a second chance to fail, and a form that
   renders in English for a Vietnamese crew is a form that gets filled in wrongly. */
var VI = {
  "Daily Report":"Báo cáo hằng ngày",
  "Sign in":"Đăng nhập","Your email address":"Địa chỉ email của bạn",
  "Send me a code":"Gửi mã cho tôi","Enter the code":"Nhập mã",
  "Six-digit code":"Mã sáu chữ số","Confirm":"Xác nhận","Use another address":"Dùng địa chỉ khác",

  "Client":"Chủ đầu tư","Contractor":"Nhà thầu","Filed by":"Người lập",
  "Reporting for":"Báo cáo cho ngày",
  "Weather":"Thời tiết","Morning":"Buổi sáng","Afternoon":"Buổi chiều","Evening":"Buổi tối",
  "Average temperature (°C)":"Nhiệt độ trung bình (°C)","Rainfall (hours)":"Thời gian mưa (giờ)",
  "Management staff":"Nhân sự quản lý","Workers":"Công nhân",
  "Equipment & machinery":"Thiết bị & máy móc","Material delivery":"Vật tư nhập về",
  "Work completed today":"Công việc hoàn thành hôm nay","Next day work plan":"Kế hoạch ngày mai",
  "Progress photos":"Hình ảnh tiến độ","Documents":"Hồ sơ","Defects":"Lỗi",
  "Inspection today":"Nghiệm thu hôm nay","Next day inspection":"Nghiệm thu ngày mai",
  "Safety checks":"Kiểm tra an toàn","Requests & recommendations":"Yêu cầu & kiến nghị",
  "Add":"Thêm","Remove":"Xóa","Save":"Lưu","Saved":"Đã lưu","Back":"Quay lại","Done":"Xong",
  "Item":"Nội dung","Quantity":"Số lượng","Unit":"Đơn vị","Notes":"Ghi chú","Location":"Vị trí",
  "Category":"Hạng mục","Document code":"Mã hồ sơ","Today (%)":"Hôm nay (%)","Overall (%)":"Lũy kế (%)",
  "Start":"Bắt đầu","Finish":"Hoàn thành","Description":"Mô tả","Corrective action":"Biện pháp khắc phục",
  "Identified":"Ngày phát hiện","Due":"Ngày dự kiến xong","Status":"Trạng thái","Time":"Thời gian",
  "Group":"Nhóm","Recommendation":"Kiến nghị","Caption":"Chú thích","Add photos":"Thêm ảnh",
  "Yes":"Có","No":"Không","N/A":"Không áp dụng","Not answered":"Chưa trả lời",
  "Nothing added yet.":"Chưa thêm mục nào.",
  "Could not save. Check your connection and try again.":
    "Không lưu được. Kiểm tra kết nối và thử lại.",
  "Sign out":"Đăng xuất","Uploading…":"Đang tải lên…","Saving…":"Đang lưu…",
  "Send it again":"Gửi lại mã","Sending…":"Đang gửi…","Sent.":"Đã gửi.",
  "The email usually arrives within a minute. If it has not, look in your spam or junk folder — the first message from a new sender often lands there.":"Email thường tới trong vòng một phút. Nếu chưa thấy, hãy kiểm tra thư mục spam hoặc thư rác — thư đầu tiên từ một người gửi mới thường rơi vào đó.",
  "A check nobody answers shows as NOT ANSWERED on the report — never as passed.":
    "Mục không ai trả lời sẽ hiển thị CHƯA TRẢ LỜI trên báo cáo — không bao giờ là đạt.",
  "Filed":"Đã gửi"
};
var lang = (localStorage.getItem('drlang') || 'en');
function t(s){ return (lang === 'vi' && VI[s]) ? VI[s] : s; }
function esc(v){ return String(v == null ? '' : v).replace(/[&<>"']/g,
  function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var TOKEN = decodeURIComponent(location.pathname.replace(/^\/dr\//, '').replace(/\/$/, ''));
var S = { date:'', setup:null, report:{}, photos:[], dates:[], view:'menu', section:null,
          email:'', contractor:'' };

/* ── talking to the server ─────────────────────────────────────────────────────────────────── */
async function api(path, body){
  var opt = { method: body ? 'POST' : 'GET', credentials:'same-origin',
              headers:{'Content-Type':'application/json'} };
  if (body) opt.body = JSON.stringify(body);
  var r, j;
  try { r = await fetch(path, opt); } catch(e){ throw new Error('offline'); }
  try { j = await r.json(); } catch(e){ j = {}; }
  /* `message` as well as `error`. A refused request answers with {"error": …}, but a request that
     was understood and could not be COMPLETED answers {"ok": false, "message": …} — which is what
     a failed code send returns, carrying the one sentence that explains it ("the portal's email is
     not working. Tell your Humiley contact"). Reading only `error` threw that away and showed
     "HTTP 502" instead: the site got a status code where the server had gone to some trouble to
     provide a reason, on the exact path the synchronous sender exists to report honestly. */
  if (!r.ok) { var err = new Error(j.error || j.message || ('HTTP ' + r.status));
               err.status = r.status; throw err; }
  return j;
}
function el(id){ return document.getElementById(id); }
function show(html){ el('app').innerHTML = html; }
function msg(kind, text){
  return '<div class="msg ' + kind + '">' + esc(text) + '</div>';
}

/* ── sign in ───────────────────────────────────────────────────────────────────────────────── */
function viewEmail(note){
  show('<div class="card">'
    + '<h2>' + t('Sign in') + '</h2>'
    + '<p class="hint">' + t('Only the addresses Humiley has listed for your company can open this form.') + '</p>'
    + '<div class="row"><label for="em">' + t('Your email address') + '</label>'
    + '<input id="em" type="email" inputmode="email" autocomplete="email" autocapitalize="off" '
    + 'spellcheck="false" value="' + esc(S.email) + '"></div>'
    + '<button class="primary wide" id="go">' + t('Send me a code') + '</button>'
    + (note || '') + '</div>');
  el('go').onclick = async function(){
    var v = (el('em').value || '').trim();
    if (!v) { el('em').focus(); return; }
    S.email = v;
    this.disabled = true; this.textContent = '…';
    try {
      var r = await api('/api/dr/site/code', { token: TOKEN, email: v });
      _resendAt = Date.now() + 45000;   // the wait starts when the mail was asked for,
                                       // not when the next screen happens to render
      viewCode(msg(r.ok ? 'info' : 'err', r.message || ''));
    } catch(e){
      viewEmail(msg('err', e.message === 'offline'
        ? t('Could not save. Check your connection and try again.') : e.message));
    }
  };
}

/* The mail leaves this server in under a second; what follows is Exchange handing off to whatever
   the site uses, and Gmail in particular will sometimes hold a first message from a new sender for
   a minute or two, or put it straight in Spam. None of that is ours to speed up. What WAS ours, and
   was missing, is everything a person needs while waiting: somewhere to look, something to press,
   and a straight answer about how long. Before this the only control on the screen was "use another
   address", so a slow mail meant starting the whole thing again — and a second request that then
   also felt slow, because the throttle is per address and the clock had already been running. */
var _resendAt = 0;          // epoch ms when "send it again" becomes pressable
var _resendTimer = null;

function _resendTick(){
  var b = el('resend'); if (!b) { clearInterval(_resendTimer); _resendTimer = null; return; }
  var left = Math.max(0, Math.ceil((_resendAt - Date.now()) / 1000));
  if (left > 0) { b.disabled = true; b.textContent = t('Send it again') + ' (' + left + 's)'; }
  else { b.disabled = false; b.textContent = t('Send it again');
         clearInterval(_resendTimer); _resendTimer = null; }
}

function viewCode(note){
  show('<div class="card">'
    + '<h2>' + t('Enter the code') + '</h2>'
    + '<p class="hint">' + esc(S.email) + '</p>'
    + '<div class="row"><label for="cd">' + t('Six-digit code') + '</label>'
    + '<input id="cd" type="text" inputmode="numeric" autocomplete="one-time-code" '
    + 'pattern="[0-9]*" maxlength="6"></div>'
    + '<button class="primary wide" id="ok">' + t('Confirm') + '</button>'
    + '<div class="msg info" style="margin-top:12px">'
    +   t('The email usually arrives within a minute. If it has not, look in your spam or junk folder — the first message from a new sender often lands there.')
    + '</div>'
    + '<div style="display:flex;gap:10px;margin-top:10px;flex-wrap:wrap">'
    +   '<button id="resend">' + t('Send it again') + '</button>'
    +   '<button class="link" id="again">' + t('Use another address') + '</button>'
    + '</div>'
    + '<div id="resendMsg"></div>'
    + (note || '') + '</div>');
  el('cd').focus();
  el('again').onclick = function(){ viewEmail(''); };

  /* Starts counting from when the code was actually requested, not from when this screen was
     drawn — otherwise a failed code entry redraws the screen and silently restarts the wait. */
  if (!_resendAt) _resendAt = Date.now() + 45000;
  _resendTick();
  if (!_resendTimer) _resendTimer = setInterval(_resendTick, 1000);

  el('resend').onclick = async function(){
    this.disabled = true;
    el('resendMsg').innerHTML = msg('info', t('Sending…'));
    try {
      var r = await api('/api/dr/site/code', { token: TOKEN, email: S.email });
      /* The server owns the throttle — three per fifteen minutes per address. When it says wait,
         it says how long, and that answer is shown rather than a guess made here. */
      /* NEVER 'ok' green. The reply here is the same sentence whether or not the address is on
         the list, so it confirms nothing — and a green tick on a message designed to say nothing
         is a false green of exactly the kind this feature keeps producing. Neutral, always. */
      el('resendMsg').innerHTML = msg('info', r.message || t('Sent.'));
      _resendAt = Date.now() + (r.throttled ? 60000 : 45000);
    } catch(e){
      el('resendMsg').innerHTML = msg('err', e.message);
      _resendAt = Date.now() + 15000;   // a failure is worth retrying sooner than a success
    }
    _resendTick();
    if (!_resendTimer) _resendTimer = setInterval(_resendTick, 1000);
  };
  el('ok').onclick = async function(){
    var c = (el('cd').value || '').replace(/\D/g, '');
    if (c.length < 4) { el('cd').focus(); return; }
    this.disabled = true; this.textContent = '…';
    try {
      var r = await api('/api/dr/site/verify', { token: TOKEN, email: S.email, code: c });
      S.contractor = r.contractor || '';
      await load();
    } catch(e){ viewCode(msg('err', e.message)); }
  };
}

/* ── the day ───────────────────────────────────────────────────────────────────────────────── */
async function load(date){
  try {
    var r = await api('/api/dr/site/day?token=' + encodeURIComponent(TOKEN)
                      + (date ? '&date=' + encodeURIComponent(date) : ''));
    S.date = r.date; S.setup = r.setup; S.report = r.report || {}; S.photos = r.photos || [];
    S.dates = r.dates || []; S.contractor = (r.contractor || {}).name || S.contractor;
    S.today = r.today || r.date;   // the SERVER's today, in the site's timezone — a phone's clock is not authority
    S.email = (r.contractor || {}).email || S.email;
    S.project = r.project || S.project || {};
    S.hasLogo = !!(r.contractor || {}).hasLogo;
    el('hWho').textContent = S.contractor + (S.email ? ' · ' + S.email : '');
    viewMenu();
  } catch(e){
    if (e.status === 401) { viewEmail(''); return; }
    show('<div class="card">' + msg('err', e.message) + '</div>');
  }
}

/* Which sections exist, in the order the printed report prints them, and how many rows each holds.
   The count is the whole navigation: a person coming back after lunch needs to see what is still
   empty without opening eleven screens. */
/* The fourth entry is the section's number in the PRINTED report — read off the exporter's own
   headings in index.html (`_drpHead`), not invented here, so the form and the document cannot
   disagree about what 5.1 is. 5.2 is deliberately absent: the Work Progress Gantt is DRAWN by the
   portal from the progress figures, not filed by the site, so there is nothing to collect for it. */
var SECTIONS = [
  ['weather','Weather','obj','1'], ['mgmt','Management staff','counts','2.1'],
  ['workers','Workers','counts','2.2'],
  ['equipment','Equipment & machinery','rows','3'], ['materials','Material delivery','rows','4'],
  ['progress','Work completed today','rows','5.1'], ['plan','Next day work plan','rows','5.3'],
  ['photos','Progress photos','photos','6'], ['documents','Documents','rows','7'],
  ['defects','Defects','rows','8'], ['inspections','Inspection today','rows','9.1'],
  ['inspectionPlan','Next day inspection','rows','9.2'], ['safety','Safety checks','safety','10'],
  ['recommendations','Requests & recommendations','rows','11']
];
function sectionNo(key){
  for (var i = 0; i < SECTIONS.length; i++) if (SECTIONS[i][0] === key) return SECTIONS[i][3] || '';
  return '';
}
function sectionCount(key, kind){
  if (kind === 'photos') return S.photos.length;
  var v = S.report[key];
  if (kind === 'rows') return (v || []).length;
  if (kind === 'counts' || kind === 'safety' || kind === 'obj') {
    var n = 0; for (var k in (v || {})) { if (String((v[k] && v[k].status) || v[k] || '') !== '') n++; }
    return n;
  }
  return 0;
}

/* The day in words. "05/09/2026" is read differently in Hanoi and in New York, and the person
   filing is about to attach fourteen sections to whichever one this is. Spelling it out makes a
   mis-tapped month visible rather than merely present. */
function saidDate(iso){
  var d = new Date((iso || '') + 'T00:00:00');
  if (isNaN(d.getTime())) return iso || '';
  var days = lang === 'vi'
    ? ['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy']
    : ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mons = lang === 'vi'
    ? ['01','02','03','04','05','06','07','08','09','10','11','12']
    : ['January','February','March','April','May','June','July','August','September','October',
       'November','December'];
  return lang === 'vi'
    ? days[d.getDay()] + ', ' + d.getDate() + '/' + mons[d.getMonth()] + '/' + d.getFullYear()
    : days[d.getDay()] + ', ' + d.getDate() + ' ' + mons[d.getMonth()] + ' ' + d.getFullYear();
}

function shiftDay(iso, n){
  var d = new Date((iso || '') + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  d.setDate(d.getDate() + n);
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function mastheadHtml(){
  var p = S.project || {};
  var yday = shiftDay(S.today || S.date, -1);
  return '<div class="doc">'
    /* Humiley left, the OWNER centre, the contractor right. The owner's project is the subject of
       the document, so their mark takes the middle; we issue it, so ours opens; the contractor
       files it, so theirs closes. The centre slot keeps its width whether or not a logo is set —
       otherwise a project with no owner artwork slides the other two together and the header
       silently changes shape between contractors. */
    + '<div class="marks">'
    +   '<span class="mk on"><img src="/static/brand/portal-logo-login.png" alt="Humiley"></span>'
    +   '<span class="mk mid' + (p.hasLogo ? ' on' : '') + '" id="mkOwner">'
    +     '<img id="mkOwnerImg" alt=""></span>'
    +   '<span class="mk end' + (S.hasLogo ? ' on' : '') + '" id="mkCon">'
    +     '<img id="mkConImg" alt=""></span>'
    + '</div>'
    + '<div class="title"><h1>' + t('Daily Report') + '</h1>'
    +   '<div class="sub">' + esc(p.name || '') + '</div></div>'
    + '<dl>'
    +   (p.client ? '<dt>' + t('Client') + '</dt><dd>' + esc(p.client) + '</dd>' : '')
    +   (p.location ? '<dt>' + t('Location') + '</dt><dd>' + esc(p.location) + '</dd>' : '')
    +   '<dt>' + t('Contractor') + '</dt><dd>' + esc(S.contractor || '') + '</dd>'
    +   '<dt>' + t('Filed by') + '</dt><dd>' + esc(S.email || '') + '</dd>'
    + '</dl>'
    + '<div class="dt">'
    +   '<div class="lab">' + t('Report date') + '</div>'
    +   '<div class="pick">'
    +     '<input id="dt" type="date" value="' + esc(S.date) + '" max="' + esc(S.today || S.date) + '">'
    +     '<span class="quick">'
    +       '<button type="button" id="dToday" aria-pressed="' + (S.date === S.today) + '">' + t('Today') + '</button>'
    +       '<button type="button" id="dYest" aria-pressed="' + (S.date === yday) + '">' + t('Yesterday') + '</button>'
    +     '</span>'
    +   '</div>'
    +   '<div class="said">' + t('Reporting for') + ' <b>' + esc(saidDate(S.date)) + '</b></div>'
    +   (S.report.submittedAt ? '<span class="filed">' + t('Filed') + '</span>' : '')
    + '</div><span class="corner"></span></div>';
}

function viewMenu(){
  var html = '<div class="reveal">' + mastheadHtml() + '<div class="card"><ul class="sections">';
  /* The report splits three of its numbers into sub-sections; the rest stand alone. Printing the
     part heading before the first child of each turns a flat run of fourteen into the document's
     own contents page. Derived from the numbers themselves, so a section that gains a sibling gets
     a heading without anybody remembering to add one. */
  var majors = {};
  SECTIONS.forEach(function(x){ var m = String(x[3]).split('.')[0]; majors[m] = (majors[m] || 0) + 1; });
  var partOf = { '2':'Manpower', '5':'Work progress', '9':'Inspection' };

  /* Grouped into BLOCKS before anything is drawn. A part and its children have to be ONE grid item:
     laid out as a flat run, the multi-column grid fills row by row and cheerfully put "2 Manpower"
     at the end of one column with 2.1 at the top of the next — a heading pointing at nothing. */
  var blocks = [], byMajor = {};
  SECTIONS.forEach(function(sec){
    var major = String(sec[3]).split('.')[0];
    if (majors[major] > 1) {
      if (!byMajor[major]) { byMajor[major] = { major: major, rows: [] }; blocks.push(byMajor[major]); }
      byMajor[major].rows.push(sec);
    } else {
      blocks.push({ major: major, rows: [sec] });
    }
  });

  function rowHtml(sec, sub){
    var n = sectionCount(sec[0], sec[2]);
    return '<button data-sec="' + sec[0] + '" class="' + (sub ? 'sub' : '') + '">'
      + '<span class="no">' + esc(sec[3] || '') + '</span>'
      + '<span class="n">' + t(sec[1]) + '</span>'
      + '<span class="count' + (n ? ' has' : '') + '">' + (n || '—') + '</span>'
      + '<span class="chev">›</span></button>';
  }

  blocks.forEach(function(b){
    var grouped = b.rows.length > 1;
    html += '<li>'
      + (grouped ? '<div class="parthead"><span class="no">' + esc(b.major) + '</span>'
                   + '<span class="nm">' + t(partOf[b.major] || '') + '</span></div>'
                   + '<div class="subs">'
                     + b.rows.map(function(r){ return rowHtml(r, true); }).join('')
                   + '</div>'
                 : rowHtml(b.rows[0], false))
      + '</li>';
  });
  var p = S.project || {};
  html += '</ul></div>'
    + '<footer class="doc-foot">'
    +   '<img src="/static/brand/Humiley_Logo_White.png" alt="Humiley">'
    +   '<div class="fline">'
    +     t('This daily report is issued by Humiley as project management consultant for') + ' <b>'
    +     esc(p.name || '') + '</b>. '
    +     t('What you save here goes straight onto the report the client receives, so file the day as it happened — a section left empty is reported as not answered, never as nothing to report.')
    +   '</div>'
    +   '<div class="fmeta"><span>' + esc(S.contractor || '') + ' · ' + esc(S.email || '') + '</span>'
    +     '<button class="signout" id="out">' + t('Sign out') + '</button></div>'
    +   '<span class="corner"></span>'
    + '</footer></div>';
  show(html);
  el('dt').onchange = function(){ if (this.value) load(this.value); };
  /* The two days anybody actually files. A site fills in today's report at the end of today, or
     yesterday's first thing the next morning; everything else is a correction and can use the
     picker. */
  el('dToday').onclick = function(){ load(S.today || S.date); };
  el('dYest').onclick  = function(){ load(shiftDay(S.today || S.date, -1)); };
  /* Both marks are fetched only now, which is only once signed in: before that a guessed token has
     to render exactly what a real one does, and either logo would say whose project this is. */
  if ((S.project || {}).hasLogo) {
    el('mkOwnerImg').src = '/api/dr/site/clientlogo?token=' + encodeURIComponent(TOKEN);
  }
  if (S.hasLogo) {
    el('mkConImg').src = '/api/dr/site/logo?token=' + encodeURIComponent(TOKEN);
  }
  el('out').onclick = async function(){ try { await api('/api/dr/site/signout', {}); } catch(e){} viewEmail(''); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-sec]'), function(b){
    b.onclick = function(){ openSection(b.getAttribute('data-sec')); };
  });
}

/* ── one section ───────────────────────────────────────────────────────────────────────────── */
var FIELDS = {
  equipment:[['item','Item','text'],['qty','Quantity','number'],['unit','Unit','text'],['notes','Notes','area']],
  materials:[['item','Item','text'],['docCode','Document code','text'],['notes','Notes','area']],
  progress:[['category','Category','cat'],['item','Item','text'],['daily','Today (%)','number'],
            ['accum','Overall (%)','number'],['start','Start','date'],['finish','Finish','date']],
  plan:[['category','Category','cat'],['item','Item','text'],['location','Location','text'],['notes','Notes','area']],
  documents:[['group','Group','group'],['item','Item','text'],['docCode','Document code','text'],
             ['category','Category','cat'],['notes','Notes','area']],
  defects:[['desc','Description','area'],['action','Corrective action','area'],
           ['identified','Identified','date'],['due','Due','date']],
  inspections:[['item','Item','text'],['location','Location','text'],['docCode','Document code','text'],
               ['status','Status','text'],['notes','Notes','area']],
  inspectionPlan:[['item','Item','text'],['location','Location','text'],['time','Time','text'],['notes','Notes','area']],
  recommendations:[['item','Recommendation','area'],['location','Location','text'],['notes','Notes','area']]
};
var DOC_GROUPS = ['7.1- Construction Shop Drawings','7.2- Method Statements',
                  '7.3- Material Submission','7.4- Other Submissions'];

function openSection(key){
  var sec = SECTIONS.filter(function(x){ return x[0] === key; })[0];
  S.section = sec; S.draft = JSON.parse(JSON.stringify(S.report[key] || (sec[2] === 'rows' ? [] : {})));
  renderSection('');
}

function renderSection(note){
  var key = S.section[0], kind = S.section[2];
  var body = kind === 'obj' ? renderWeather()
           : kind === 'counts' ? renderCounts(key)
           : kind === 'safety' ? renderSafety()
           : kind === 'photos' ? renderPhotos()
           : renderRows(key);
  /* Eyebrow first: the number this becomes in the report the client reads. Somebody filling in a
     column of headcounts should be able to see, without asking, that it is table 2.1. */
  var no = S.section[3] || '';
  show('<div class="card reveal">'
     + (no ? '<div class="eyebrow">' + t('Section') + ' ' + esc(no) + '</div>' : '')
     + '<h2>' + t(S.section[1]) + '</h2>' + body + (note || '') + '</div>'
     + (kind === 'photos' ? '' :
        '<div class="bar"><button id="back">' + t('Back') + '</button>'
        + '<button class="primary" id="save">' + t('Save') + '</button></div>'));
  if (el('back')) el('back').onclick = viewMenu;
  if (el('save')) el('save').onclick = saveSection;
  wire();
}

function renderWeather(){
  var w = S.draft || {}, opts = (S.setup.weather || []);
  function sel(k, label){
    return '<div class="row"><label>' + t(label) + '</label><select data-w="' + k + '">'
      + '<option value=""></option>'
      + opts.map(function(o){
          var v = o.charAt(0).toUpperCase() + o.slice(1);
          return '<option' + (String(w[k]||'').toLowerCase() === o ? ' selected' : '') + '>' + esc(v) + '</option>';
        }).join('') + '</select></div>';
  }
  return sel('morning','Morning') + sel('afternoon','Afternoon') + sel('evening','Evening')
    + '<div class="grid g2"><div class="row"><label>' + t('Average temperature (°C)') + '</label>'
    + '<input data-w="avgTemp" type="number" inputmode="decimal" value="' + esc(w.avgTemp||'') + '"></div>'
    + '<div class="row"><label>' + t('Rainfall (hours)') + '</label>'
    + '<input data-w="rainHours" type="number" inputmode="decimal" value="' + esc(w.rainHours||'') + '"></div></div>';
}

function renderCounts(key){
  var names = key === 'mgmt' ? (S.setup.mgmtRoles||[]) : (S.setup.workerTrades||[]);
  var v = S.draft || {};
  if (!names.length) return msg('info', 'Humiley has not set up this list yet.');
  return '<div class="grid g2">' + names.map(function(n){
    return '<div class="row"><label>' + esc(n) + '</label>'
      + '<input data-c="' + esc(n) + '" type="number" inputmode="numeric" min="0" value="'
      + esc(v[n] === 0 || v[n] ? v[n] : '') + '"></div>';
  }).join('') + '</div>';
}

function renderSafety(){
  var v = S.draft || {};
  return '<p class="hint">' + t('A check nobody answers shows as NOT ANSWERED on the report — never as passed.') + '</p>'
    + (S.setup.safetyChecks||[]).map(function(c){
        var cur = (v[c] && v[c].status) || '';
        return '<div class="row"><label>' + esc(c) + '</label><select data-s="' + esc(c) + '">'
          + '<option value=""></option>'
          + ['Yes','No','N/A'].map(function(o){
              return '<option value="' + o + '"' + (cur === o ? ' selected' : '') + '>' + t(o) + '</option>';
            }).join('') + '</select></div>';
      }).join('');
}

function renderRows(key){
  var spec = FIELDS[key] || [], rows = S.draft || [];
  var html = rows.length ? '' : msg('info', t('Nothing added yet.'));
  rows.forEach(function(r, i){
    html += '<div class="item"><div class="top"><b>' + (i+1) + '</b>'
      + '<button class="del" data-del="' + i + '">' + t('Remove') + '</button></div>';
    spec.forEach(function(f){
      html += '<div class="row"><label>' + t(f[1]) + '</label>' + field(f, r[f[0]] || '', i) + '</div>';
    });
    html += '</div>';
  });
  return html + '<button class="wide" id="add">+ ' + t('Add') + '</button>';
}

function field(f, val, i){
  var attr = 'data-r="' + i + '" data-f="' + f[0] + '"';
  if (f[2] === 'area') return '<textarea ' + attr + '>' + esc(val) + '</textarea>';
  if (f[2] === 'date') return '<input ' + attr + ' type="date" value="' + esc(val) + '">';
  if (f[2] === 'number') return '<input ' + attr + ' type="number" inputmode="decimal" value="' + esc(val) + '">';
  if (f[2] === 'cat' || f[2] === 'group') {
    var opts = f[2] === 'cat' ? (S.setup.categories || []) : DOC_GROUPS;
    return '<select ' + attr + '><option value=""></option>' + opts.map(function(o){
      return '<option' + (val === o ? ' selected' : '') + '>' + esc(o) + '</option>';
    }).join('') + '</select>';
  }
  return '<input ' + attr + ' type="text" value="' + esc(val) + '">';
}

function wire(){
  if (el('add')) el('add').onclick = function(){ S.draft.push({}); renderSection(''); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function(b){
    b.onclick = function(){ S.draft.splice(+b.getAttribute('data-del'), 1); renderSection(''); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-r]'), function(inp){
    inp.oninput = function(){ S.draft[+inp.getAttribute('data-r')][inp.getAttribute('data-f')] = inp.value; };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-w]'), function(inp){
    inp.oninput = inp.onchange = function(){ S.draft[inp.getAttribute('data-w')] = inp.value; };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-c]'), function(inp){
    inp.oninput = function(){ S.draft[inp.getAttribute('data-c')] = inp.value; };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-s]'), function(sl){
    sl.onchange = function(){
      var k = sl.getAttribute('data-s');
      if (sl.value) S.draft[k] = { status: sl.value, notes: (S.draft[k]||{}).notes || '' };
      else delete S.draft[k];
    };
  });
  if (el('pick')) el('pick').onchange = uploadPhotos;
}

async function saveSection(){
  var b = el('save'); b.disabled = true; b.textContent = t('Saving…');
  try {
    await api('/api/dr/site/save', { token: TOKEN, date: S.date,
                                     field: S.section[0], value: S.draft });
    S.report[S.section[0]] = S.draft;
    viewMenu();
  } catch(e){
    b.disabled = false; b.textContent = t('Save');
    renderSection(msg('err', e.status === 401 ? e.message
      : (e.message === 'offline' ? t('Could not save. Check your connection and try again.') : e.message)));
  }
}

/* ── photos ────────────────────────────────────────────────────────────────────────────────── */
function renderPhotos(){
  var cats = S.setup.categories || [];
  return '<div class="row"><label>' + t('Category') + '</label><select id="pcat">'
    + cats.map(function(c){ return '<option>' + esc(c) + '</option>'; }).join('') + '</select></div>'
    + '<div class="row"><label for="pick">' + t('Add photos') + '</label>'
    + '<input id="pick" type="file" accept="image/*" multiple></div>'
    + '<div id="pstat"></div>'
    + '<div class="photos">' + S.photos.map(function(p){
        return '<figure><img src="/api/dr/photo/' + encodeURIComponent(p.id) + '" alt="" loading="lazy">'
          + '<figcaption>' + esc(p.category || '') + '</figcaption></figure>';
      }).join('') + '</div>'
    + '<div class="bar"><button id="back2">' + t('Done') + '</button></div>';
}

/* Downscaled in the browser BEFORE upload. A modern phone photo is 4-6 MB and a site connection is
   not; 1600px is more than the report ever draws, and it turns a minute of waiting into a second. */
function shrink(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onerror = function(){ rej(new Error('unreadable')); };
    fr.onload = function(){
      var im = new Image();
      im.onerror = function(){ rej(new Error('not an image')); };
      im.onload = function(){
        try {
          var k = Math.min(1, 1600 / Math.max(im.width, im.height));
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * k));
          c.height = Math.max(1, Math.round(im.height * k));
          c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
          res(c.toDataURL('image/jpeg', 0.82));
        } catch(e){ res(fr.result); }   // a canvas that refuses (HEIC on an old browser) sends as-is
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function uploadPhotos(){
  var files = Array.prototype.slice.call(el('pick').files || []);
  if (!files.length) return;
  var cat = el('pcat') ? el('pcat').value : '';
  var stat = el('pstat'), done = 0;
  for (var i = 0; i < files.length; i++) {
    stat.innerHTML = msg('info', t('Uploading…') + ' ' + (i + 1) + '/' + files.length);
    try {
      var data = await shrink(files[i]);
      var r = await api('/api/dr/site/photo', { token: TOKEN, date: S.date, category: cat,
                                                name: files[i].name, dataUrl: data });
      S.photos.push({ id: r.id, category: cat, caption: '', fileName: files[i].name });
      done++;
    } catch(e){
      stat.innerHTML = msg('err', e.message);
      break;
    }
  }
  if (done) { el('pick').value = ''; renderSection(msg('ok', t('Saved'))); wirePhotoBack(); }
}
function wirePhotoBack(){ if (el('back2')) el('back2').onclick = viewMenu; }

/* ── boot ──────────────────────────────────────────────────────────────────────────────────── */
/* Two buttons, both always visible, the current one pressed — rather than one button naming the
   language you are NOT in, which never tells you which state you are already in. */
function setLang(next){
  lang = next;
  try { localStorage.setItem('drlang', lang); } catch(e){}
  el('langEn').setAttribute('aria-pressed', String(lang !== 'vi'));
  el('langVi').setAttribute('aria-pressed', String(lang === 'vi'));
  el('hTitle').firstChild.nodeValue = t('Daily Report');
  if (S.setup) { S.view === 'menu' ? viewMenu() : renderSection(''); } else { viewEmail(''); }
}
el('langEn').onclick = function(){ if (lang !== 'en') setLang('en'); };
el('langVi').onclick = function(){ if (lang !== 'vi') setLang('vi'); };
el('langEn').setAttribute('aria-pressed', String(lang !== 'vi'));
el('langVi').setAttribute('aria-pressed', String(lang === 'vi'));
el('hTitle').firstChild.nodeValue = t('Daily Report');
var _origRender = renderSection;
renderSection = function(n){ S.view = 'section'; _origRender(n); if (el('back2')) el('back2').onclick = viewMenu; };
var _origMenu = viewMenu;
viewMenu = function(){ S.view = 'menu'; _origMenu(); };
load();
</script>
